[unix_http_server]
file=/run/supervisord.sock
chmod=0700

[supervisorctl]
serverurl=unix:///run/supervisord.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisord]
nodaemon=true
user=root
logfile=/dev/stdout
logfile_maxbytes=0
loglevel=warn
pidfile=/run/supervisord.pid

[program:postgres]
# ROK-1156: pg_stat_statements is preloaded so the extension can capture per-query stats; log_min_duration_statement surfaces any statement slower than 200ms in postgresql.log.
# ROK-1164: log_min_messages=WARNING (was FATAL, which also dropped the LOG-level slow-statement lines, since LOG ranks above ERROR). log_checkpoints=off keeps the periodic checkpoint LOG lines out; log_parameter_max_length=0 keeps bind values (user data) out of the slow-statement lines.
command=/bin/bash -c '/sbin/su-exec postgres /usr/libexec/postgresql16/postgres -D /data/postgresql -c log_min_messages=WARNING -c log_checkpoints=off -c log_parameter_max_length=0 -c shared_preload_libraries=pg_stat_statements -c log_min_duration_statement=200ms -c pg_stat_statements.track=all 2>&1 | tee -a /data/logs/postgresql.log'
autostart=true
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
stopwaitsecs=5
stopsignal=TERM
killasgroup=true
stopasgroup=true

[program:redis]
command=/bin/bash -c '/usr/bin/redis-server --dir /data/redis --daemonize no --port 0 --unixsocket /tmp/redis.sock --unixsocketperm 770 2>&1 | tee -a /data/logs/redis.log'
user=redis
autostart=true
autorestart=true
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
stopwaitsecs=5
stopsignal=TERM

[program:nginx]
# ROK-1164: no nginx.log tee. nginx writes its own files (nginx-access.log,
# nginx-error.log); stdout/stderr only ever carried pre-config startup errors,
# which still reach `docker logs` via stdout_logfile below.
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
priority=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:api]
# R11 / TDB:2085: SIGTERM must reach node so Nest's shutdown hooks run
# (enableShutdownHooks in api/src/main.ts). stopasgroup signals the whole
# process group (bash, node, tee). The wrapper bash and tee IGNORE SIGTERM
# ("shielded tee"): bash keeps waiting on the pipeline so supervisor sees the
# api as stopped only after node exits, and tee keeps draining node's shutdown
# logs to EOF instead of dying and EPIPE-ing them. The `( trap - TERM; exec ... )`
# subshell restores the default so start-api.sh / node still get SIGTERM.
# stopwaitsecs=7 then killasgroup SIGKILLs the group; 7s keeps the api plus
# nginx/redis/postgres stops inside docker's default 10s stop grace.
command=/bin/bash -c 'trap "" TERM; ( trap - TERM; exec /app/start-api.sh ) 2>&1 | tee -a /data/logs/api.log'
stopsignal=TERM
stopasgroup=true
killasgroup=true
stopwaitsecs=7
directory=/app
environment=PORT=3000
user=app
autostart=true
autorestart=true
priority=40
startsecs=15
startretries=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:logrotate]
command=/bin/bash -c 'while true; do /usr/sbin/logrotate /etc/logrotate.d/raid-ledger --state /data/logs/.logrotate.state; sleep 86400; done'
autostart=true
autorestart=true
priority=50
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[eventlistener:process_events]
command=/app/supervisor-events.sh
events=PROCESS_STATE
buffer_size=100
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[include]
files = /etc/supervisor.d/services/*.ini
